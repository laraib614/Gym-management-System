<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Membership Plans — GymMS</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>

  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">G</div>
      <div class="logo-text">GymMS <span>Management System</span></div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-label">Main</div>
      <a class="nav-item" href="../index.html"><span class="nav-icon">🏠</span> Dashboard</a>
      <div class="nav-label">Records</div>
      <a class="nav-item" href="members.html"><span class="nav-icon">👥</span> Members</a>
      <a class="nav-item" href="trainers.html"><span class="nav-icon">🏋️</span> Trainers</a>
      <a class="nav-item active" href="plans.html"><span class="nav-icon">📋</span> Membership Plans</a>
      <div class="nav-label">Store</div>
      <a class="nav-item" href="products.html"><span class="nav-icon">🛒</span> Products</a>
      <a class="nav-item" href="purchases.html"><span class="nav-icon">💳</span> Purchases</a>
    </nav>
  </aside>

  <div class="main-wrap">
    <header class="topbar">
      <div>
        <div class="topbar-title">Membership Plans</div>
        <div class="topbar-subtitle">MySQL: Membership_Plan table</div>
      </div>
      <div class="topbar-right">
        <button class="btn btn-primary" onclick="openModal('add-modal')">＋ New Plan</button>
      </div>
    </header>

    <main class="page-content">

      <!-- Plan Cards -->
      <div id="plan-cards" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px;margin-bottom:32px">
        <div class="stat-card"><div class="stat-icon">⏳</div><div class="stat-label">Loading plans…</div></div>
      </div>

      <div class="section-header">
        <span class="section-title">All <span>Plans</span></span>
      </div>
      <div class="table-wrap">
        <table id="plans-table">
          <thead>
            <tr><th>ID</th><th>Plan Name</th><th>Duration</th><th>Price</th><th>Per Month</th><th>Enrolled</th><th>Actions</th></tr>
          </thead>
          <tbody id="plans-tbody">
            <tr><td colspan="7" style="text-align:center;padding:40px;color:var(--text-muted)">⏳ Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- Add Modal -->
  <div class="modal-overlay" id="add-modal">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title">Create Membership Plan</span>
        <button class="modal-close" onclick="closeModal('add-modal')">✕</button>
      </div>
      <div class="form-grid">
        <div class="form-group full-width"><label>Plan Name *</label><input type="text" id="f-name" placeholder="e.g. Quarterly" /></div>
        <div class="form-group"><label>Duration (months) *</label><input type="number" id="f-dur" min="1" max="24" placeholder="3" /></div>
        <div class="form-group"><label>Price (₹) *</label><input type="number" id="f-price" min="0" placeholder="2500" /></div>
      </div>
      <div class="form-actions">
        <button class="btn btn-primary" onclick="addPlan()">Save Plan</button>
        <button class="btn btn-ghost" onclick="closeModal('add-modal')">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Edit Modal -->
  <div class="modal-overlay" id="edit-modal">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title">Edit Plan</span>
        <button class="modal-close" onclick="closeModal('edit-modal')">✕</button>
      </div>
      <input type="hidden" id="ef-id" />
      <div class="form-grid">
        <div class="form-group full-width"><label>Plan Name *</label><input type="text" id="ef-name" /></div>
        <div class="form-group"><label>Duration (months) *</label><input type="number" id="ef-dur" min="1" /></div>
        <div class="form-group"><label>Price (₹) *</label><input type="number" id="ef-price" min="0" /></div>
      </div>
      <div class="form-actions">
        <button class="btn btn-primary" onclick="saveEdit()">Update Plan</button>
        <button class="btn btn-ghost" onclick="closeModal('edit-modal')">Cancel</button>
      </div>
    </div>
  </div>

  <script src="../js/app.js"></script>
  <script>
    const PLAN_COLORS = ['var(--accent)','var(--accent-green)','var(--accent-blue)','var(--accent-red)','#c084fc'];
    const PLAN_ICONS  = ['🥉','🥈','🥇','💎','🌟'];

    async function loadPlans() {
      const res = await apiGet('plans');
      if (!res.success) {
        document.getElementById('plans-tbody').innerHTML =
          `<tr><td colspan="7" style="text-align:center;padding:40px;color:var(--accent-red)">❌ Failed to load. Is XAMPP running?</td></tr>`;
        return;
      }

      /* Cards */
      document.getElementById('plan-cards').innerHTML = res.data.length
        ? res.data.map((p, i) => {
          const color    = PLAN_COLORS[i % PLAN_COLORS.length];
          const perMonth = Math.round(p.price / p.duration_months);
          return `
            <div class="stat-card" style="border-top:3px solid ${color}">
              <div style="font-size:34px">${PLAN_ICONS[i % PLAN_ICONS.length]}</div>
              <div class="font-display" style="font-size:28px;font-weight:900;color:${color}">${fmt.currency(p.price)}</div>
              <div class="fw-bold" style="font-size:17px">${p.plan_name}</div>
              <div style="font-size:12px;color:var(--text-secondary)">${p.duration_months} month${p.duration_months>1?'s':''} · ${fmt.currency(perMonth)}/mo</div>
              <div style="font-size:12px;color:var(--text-muted);margin-top:4px">👥 ${p.enrolled_members || 0} enrolled</div>
            </div>`;
        }).join('')
        : '<div class="empty-state"><div class="empty-icon">📋</div><p>No plans yet.</p></div>';

      /* Table */
      document.getElementById('plans-tbody').innerHTML = res.data.length
        ? res.data.map((p, i) => {
          const perMonth = Math.round(p.price / p.duration_months);
          return `
            <tr>
              <td class="td-muted">${p.membership_id}</td>
              <td class="fw-bold">${p.plan_name}</td>
              <td>${p.duration_months} month${p.duration_months>1?'s':''}</td>
              <td class="text-accent fw-bold font-display" style="font-size:16px">${fmt.currency(p.price)}</td>
              <td class="td-muted">${fmt.currency(perMonth)}</td>
              <td><span class="badge badge-green">${p.enrolled_members || 0} members</span></td>
              <td>
                <div class="td-actions">
                  <button class="btn btn-ghost btn-sm" onclick='editPlan(${JSON.stringify(p)})'>✏️ Edit</button>
                  <button class="btn btn-danger btn-sm" onclick="deletePlan(${p.membership_id},'${p.plan_name}')">🗑 Delete</button>
                </div>
              </td>
            </tr>`;
        }).join('')
        : `<tr><td colspan="7"><div class="empty-state"><p>No plans.</p></div></td></tr>`;
    }

    async function addPlan() {
      const name  = document.getElementById('f-name').value.trim();
      const dur   = +document.getElementById('f-dur').value;
      const price = +document.getElementById('f-price').value;
      if (!name || !dur || !price) { showToast('Fill all fields.', 'error'); return; }
      const res = await apiPost('plans', { plan_name: name, duration_months: dur, price });
      if (res.success) {
        closeModal('add-modal');
        ['f-name','f-dur','f-price'].forEach(id => document.getElementById(id).value = '');
        showToast(res.message);
        loadPlans();
      } else showToast(res.error || 'Failed.', 'error');
    }

    function editPlan(p) {
      document.getElementById('ef-id').value    = p.membership_id;
      document.getElementById('ef-name').value  = p.plan_name;
      document.getElementById('ef-dur').value   = p.duration_months;
      document.getElementById('ef-price').value = p.price;
      openModal('edit-modal');
    }

    async function saveEdit() {
      const id   = +document.getElementById('ef-id').value;
      const name = document.getElementById('ef-name').value.trim();
      if (!name) { showToast('Plan name required.', 'error'); return; }
      const res = await apiPut('plans', {
        membership_id: id, plan_name: name,
        duration_months: +document.getElementById('ef-dur').value,
        price: +document.getElementById('ef-price').value,
      });
      if (res.success) { closeModal('edit-modal'); showToast(res.message); loadPlans(); }
      else showToast(res.error || 'Update failed.', 'error');
    }

    async function deletePlan(id, name) {
      if (!confirm(`Delete plan "${name}"?`)) return;
      const res = await apiDelete('plans', { membership_id: id });
      if (res.success) { showToast(res.message); loadPlans(); }
      else showToast(res.error, 'error');
    }

    loadPlans();
  </script>
</body>
</html>
