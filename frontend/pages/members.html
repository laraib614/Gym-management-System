<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Members — GymMS</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>

  <!-- ── Sidebar ───────────────────────────────────────────── -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">G</div>
      <div class="logo-text">GymMS <span>Management System</span></div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-label">Main</div>
      <a class="nav-item" data-page="dashboard" href="../index.html">
        <span class="nav-icon">🏠</span> Dashboard
      </a>
      <div class="nav-label">Records</div>
      <a class="nav-item active" data-page="members" href="members.html">
        <span class="nav-icon">👥</span> Members
      </a>
      <a class="nav-item" data-page="trainers" href="trainers.html">
        <span class="nav-icon">🏋️</span> Trainers
      </a>
      <a class="nav-item" data-page="plans" href="plans.html">
        <span class="nav-icon">📋</span> Membership Plans
      </a>
      <div class="nav-label">Store</div>
      <a class="nav-item" data-page="products" href="products.html">
        <span class="nav-icon">🛒</span> Products
      </a>
      <a class="nav-item" data-page="purchases" href="purchases.html">
        <span class="nav-icon">💳</span> Purchases
      </a>
    </nav>
  </aside>

  <!-- ── Main ──────────────────────────────────────────────── -->
  <div class="main-wrap">
    <header class="topbar">
      <div>
        <div class="topbar-title">Members</div>
        <div class="topbar-subtitle">Manage gym members</div>
      </div>
      <div class="topbar-right">
        <div class="search-bar">
          <span class="search-icon">🔍</span>
          <input type="text" id="search-input" placeholder="Search members…" />
        </div>
        <button class="btn btn-primary" onclick="openModal('add-modal')">
          ＋ Add Member
        </button>
      </div>
    </header>

    <main class="page-content">
      <div class="table-wrap">
        <table id="members-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Name</th>
              <th>Age</th>
              <th>Gender</th>
              <th>Phone</th>
              <th>Join Date</th>
              <th>Plan</th>
              <th>Trainer</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="members-tbody"></tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- ── Add Member Modal ──────────────────────────────────── -->
  <div class="modal-overlay" id="add-modal">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title">Add New Member</span>
        <button class="modal-close" onclick="closeModal('add-modal')">✕</button>
      </div>
      <div class="form-grid" id="add-form">
        <div class="form-group">
          <label>Full Name *</label>
          <input type="text" id="f-name" placeholder="e.g. Ankit Gupta" />
        </div>
        <div class="form-group">
          <label>Age *</label>
          <input type="number" id="f-age" min="10" max="99" placeholder="25" />
        </div>
        <div class="form-group">
          <label>Gender *</label>
          <select id="f-gender">
            <option value="">Select…</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
          </select>
        </div>
        <div class="form-group">
          <label>Phone</label>
          <input type="tel" id="f-phone" placeholder="10-digit number" />
        </div>
        <div class="form-group">
          <label>Join Date *</label>
          <input type="date" id="f-join" />
        </div>
        <div class="form-group">
          <label>Membership Plan *</label>
          <select id="f-plan"></select>
        </div>
        <div class="form-group">
          <label>Assign Trainer</label>
          <select id="f-trainer">
            <option value="">— No Trainer —</option>
          </select>
        </div>
      </div>
      <div class="form-actions">
        <button class="btn btn-primary" onclick="addMember()">Save Member</button>
        <button class="btn btn-ghost" onclick="closeModal('add-modal')">Cancel</button>
      </div>
    </div>
  </div>

  <!-- ── Edit Member Modal ─────────────────────────────────── -->
  <div class="modal-overlay" id="edit-modal">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title">Edit Member</span>
        <button class="modal-close" onclick="closeModal('edit-modal')">✕</button>
      </div>
      <input type="hidden" id="ef-id" />
      <div class="form-grid">
        <div class="form-group">
          <label>Full Name *</label>
          <input type="text" id="ef-name" />
        </div>
        <div class="form-group">
          <label>Age *</label>
          <input type="number" id="ef-age" min="10" max="99" />
        </div>
        <div class="form-group">
          <label>Gender *</label>
          <select id="ef-gender">
            <option>Male</option><option>Female</option><option>Other</option>
          </select>
        </div>
        <div class="form-group">
          <label>Phone</label>
          <input type="tel" id="ef-phone" />
        </div>
        <div class="form-group">
          <label>Join Date *</label>
          <input type="date" id="ef-join" />
        </div>
        <div class="form-group">
          <label>Membership Plan *</label>
          <select id="ef-plan"></select>
        </div>
        <div class="form-group">
          <label>Assign Trainer</label>
          <select id="ef-trainer">
            <option value="">— No Trainer —</option>
          </select>
        </div>
      </div>
      <div class="form-actions">
        <button class="btn btn-primary" onclick="saveEdit()">Update Member</button>
        <button class="btn btn-ghost" onclick="closeModal('edit-modal')">Cancel</button>
      </div>
    </div>
  </div>

  <script src="../js/app.js"></script>
  <script>
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('f-join').value = today;

    /* Populate dropdowns */
    function fillDropdowns(planSel, trainerSel) {
      const plans    = DB.get('plans');
      const trainers = DB.get('trainers');
      planSel.innerHTML    = plans.map(p => `<option value="${p.id}">${p.plan_name} (${p.duration_months}mo — ${fmt.currency(p.price)})</option>`).join('');
      trainerSel.innerHTML = '<option value="">— No Trainer —</option>' +
        trainers.map(t => `<option value="${t.id}">${t.trainer_name} — ${t.specialization}</option>`).join('');
    }
    fillDropdowns(document.getElementById('f-plan'), document.getElementById('f-trainer'));
    fillDropdowns(document.getElementById('ef-plan'), document.getElementById('ef-trainer'));

    /* Render table */
    function renderTable() {
      const members  = DB.get('members');
      const plans    = Object.fromEntries(DB.get('plans').map(p => [p.id, p.plan_name]));
      const trainers = Object.fromEntries(DB.get('trainers').map(t => [t.id, t.trainer_name]));

      document.getElementById('members-tbody').innerHTML = members.length
        ? members.map(m => `
          <tr>
            <td class="td-muted">${m.id}</td>
            <td class="fw-bold">${m.name}</td>
            <td>${m.age}</td>
            <td><span class="badge ${m.gender==='Male'?'badge-blue':'badge-green'}">${m.gender}</span></td>
            <td class="td-muted">${m.phone || '—'}</td>
            <td class="td-muted">${fmt.date(m.join_date)}</td>
            <td><span class="badge badge-amber">${plans[m.membership_id] || '—'}</span></td>
            <td class="td-muted">${trainers[m.trainer_id] || '—'}</td>
            <td>
              <div class="td-actions">
                <button class="btn btn-ghost btn-sm" onclick="editMember(${m.id})">✏️ Edit</button>
                <button class="btn btn-danger btn-sm" onclick="deleteMember(${m.id})">🗑 Delete</button>
              </div>
            </td>
          </tr>
        `).join('')
        : '<tr><td colspan="9"><div class="empty-state"><div class="empty-icon">👥</div><p>No members yet. Add your first member!</p></div></td></tr>';

      setupTableSearch('search-input', 'members-table');
    }

    /* Add */
    function addMember() {
      const name = document.getElementById('f-name').value.trim();
      const age  = document.getElementById('f-age').value;
      const gender = document.getElementById('f-gender').value;
      const join  = document.getElementById('f-join').value;
      const plan  = document.getElementById('f-plan').value;
      if (!name || !age || !gender || !join || !plan) { showToast('Please fill all required fields.', 'error'); return; }

      DB.insert('members', {
        name, age: +age, gender,
        phone: document.getElementById('f-phone').value,
        join_date: join,
        membership_id: +plan,
        trainer_id: +document.getElementById('f-trainer').value || null,
      });
      closeModal('add-modal');
      document.getElementById('f-name').value = '';
      document.getElementById('f-age').value  = '';
      document.getElementById('f-phone').value = '';
      renderTable();
      showToast(`Member "${name}" added successfully!`);
    }

    /* Edit */
    function editMember(id) {
      const m = DB.get('members').find(r => r.id === id);
      if (!m) return;
      document.getElementById('ef-id').value    = m.id;
      document.getElementById('ef-name').value  = m.name;
      document.getElementById('ef-age').value   = m.age;
      document.getElementById('ef-gender').value = m.gender;
      document.getElementById('ef-phone').value = m.phone;
      document.getElementById('ef-join').value  = m.join_date;
      document.getElementById('ef-plan').value  = m.membership_id;
      document.getElementById('ef-trainer').value = m.trainer_id || '';
      openModal('edit-modal');
    }

    function saveEdit() {
      const id = +document.getElementById('ef-id').value;
      const name = document.getElementById('ef-name').value.trim();
      if (!name) { showToast('Name is required.', 'error'); return; }
      DB.update('members', id, {
        name,
        age: +document.getElementById('ef-age').value,
        gender: document.getElementById('ef-gender').value,
        phone: document.getElementById('ef-phone').value,
        join_date: document.getElementById('ef-join').value,
        membership_id: +document.getElementById('ef-plan').value,
        trainer_id: +document.getElementById('ef-trainer').value || null,
      });
      closeModal('edit-modal');
      renderTable();
      showToast(`Member "${name}" updated.`);
    }

    /* Delete */
    function deleteMember(id) {
      const m = DB.get('members').find(r => r.id === id);
      if (!confirm(`Delete member "${m?.name}"? This cannot be undone.`)) return;
      DB.delete('members', id);
      renderTable();
      showToast(`Member deleted.`, 'error');
    }

    renderTable();
  </script>
</body>
</html>
