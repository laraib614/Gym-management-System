<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — GymMS</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ── Sidebar ───────────────────────────────────────────── -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">G</div>
      <div class="logo-text">GymMS <span>Management System</span></div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-label">Main</div>
      <a class="nav-item active" data-page="dashboard" href="index.html">
        <span class="nav-icon">🏠</span> Dashboard
      </a>
      <div class="nav-label">Records</div>
      <a class="nav-item" data-page="members" href="pages/members.html">
        <span class="nav-icon">👥</span> Members
      </a>
      <a class="nav-item" data-page="trainers" href="pages/trainers.html">
        <span class="nav-icon">🏋️</span> Trainers
      </a>
      <a class="nav-item" data-page="plans" href="pages/plans.html">
        <span class="nav-icon">📋</span> Membership Plans
      </a>
      <div class="nav-label">Store</div>
      <a class="nav-item" data-page="products" href="pages/products.html">
        <span class="nav-icon">🛒</span> Products
      </a>
      <a class="nav-item" data-page="purchases" href="pages/purchases.html">
        <span class="nav-icon">💳</span> Purchases
      </a>
    </nav>
  </aside>

  <!-- ── Main ──────────────────────────────────────────────── -->
  <div class="main-wrap">
    <header class="topbar">
      <div>
        <div class="topbar-title">Dashboard</div>
        <div class="topbar-subtitle">Overview of gym operations</div>
      </div>
      <div class="topbar-right">
        <span class="topbar-badge" id="today-date"></span>
      </div>
    </header>

    <main class="page-content">

      <!-- Stats -->
      <div class="stats-grid" id="stats-grid"></div>

      <!-- Two-column summary -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:28px">

        <!-- Recent Members -->
        <div>
          <div class="section-header">
            <span class="section-title">Recent <span>Members</span></span>
            <a href="pages/members.html" class="btn btn-ghost btn-sm">View All</a>
          </div>
          <div class="table-wrap">
            <table id="recent-members-table">
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Plan</th>
                  <th>Joined</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>

        <!-- Recent Purchases -->
        <div>
          <div class="section-header">
            <span class="section-title">Recent <span>Purchases</span></span>
            <a href="pages/purchases.html" class="btn btn-ghost btn-sm">View All</a>
          </div>
          <div class="table-wrap">
            <table id="recent-purchases-table">
              <thead>
                <tr>
                  <th>Member</th>
                  <th>Product</th>
                  <th>Amount</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>

      </div>

      <!-- Plan Distribution -->
      <div class="section-header">
        <span class="section-title">Membership <span>Plan Distribution</span></span>
      </div>
      <div id="plan-bars" style="background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px 24px 16px;"></div>

    </main>
  </div>

  <script src="js/app.js"></script>
  <script>
    /* ── Date display ─────────────────────────────────────── */
    document.getElementById('today-date').textContent =
      new Date().toLocaleDateString('en-IN', { weekday:'short', day:'2-digit', month:'long', year:'numeric' });

    /* ── Load stats ───────────────────────────────────────── */
    function loadDashboard() {
      const members   = DB.get('members');
      const trainers  = DB.get('trainers');
      const plans     = DB.get('plans');
      const products  = DB.get('products');
      const purchases = DB.get('purchases');

      const totalRevenue = purchases.reduce((s, p) => s + Number(p.total_price), 0);

      const statsData = [
        { icon: '👥', value: members.length,   label: 'Total Members'    },
        { icon: '🏋️', value: trainers.length,  label: 'Active Trainers'  },
        { icon: '📋', value: plans.length,      label: 'Membership Plans' },
        { icon: '🛒', value: products.length,   label: 'Products'         },
        { icon: '💳', value: purchases.length,  label: 'Total Purchases'  },
        { icon: '💰', value: fmt.currency(totalRevenue), label: 'Total Revenue' },
      ];

      document.getElementById('stats-grid').innerHTML = statsData.map(s => `
        <div class="stat-card">
          <div class="stat-icon">${s.icon}</div>
          <div class="stat-value">${s.value}</div>
          <div class="stat-label">${s.label}</div>
        </div>
      `).join('');

      /* Recent members */
      const planMap = Object.fromEntries(plans.map(p => [p.id, p.plan_name]));
      const recentMembers = [...members].reverse().slice(0, 5);
      document.querySelector('#recent-members-table tbody').innerHTML =
        recentMembers.map(m => `
          <tr>
            <td class="fw-bold">${m.name}</td>
            <td><span class="badge badge-amber">${planMap[m.membership_id] || '—'}</span></td>
            <td class="td-muted">${fmt.date(m.join_date)}</td>
          </tr>
        `).join('') || '<tr><td colspan="3" class="td-muted" style="text-align:center;padding:24px">No members yet</td></tr>';

      /* Recent purchases */
      const memberMap  = Object.fromEntries(members.map(m => [m.id, m.name]));
      const productMap = Object.fromEntries(products.map(p => [p.id, p.product_name]));
      const recentPurchases = [...purchases].reverse().slice(0, 5);
      document.querySelector('#recent-purchases-table tbody').innerHTML =
        recentPurchases.map(p => `
          <tr>
            <td>${memberMap[p.member_id] || '—'}</td>
            <td class="td-muted">${productMap[p.product_id] || '—'}</td>
            <td class="text-green fw-bold">${fmt.currency(p.total_price)}</td>
          </tr>
        `).join('') || '<tr><td colspan="3" class="td-muted" style="text-align:center;padding:24px">No purchases yet</td></tr>';

      /* Plan bar chart */
      const planCounts = {};
      members.forEach(m => {
        const name = planMap[m.membership_id] || 'Unknown';
        planCounts[name] = (planCounts[name] || 0) + 1;
      });
      const maxCount = Math.max(...Object.values(planCounts), 1);
      const colors = ['var(--accent)', 'var(--accent-green)', 'var(--accent-blue)', 'var(--accent-red)'];
      const barsHtml = Object.entries(planCounts).map(([name, count], i) => `
        <div style="display:flex;align-items:center;gap:14px;margin-bottom:14px">
          <div style="width:120px;font-size:13px;font-weight:600;color:var(--text-secondary);flex-shrink:0">${name}</div>
          <div style="flex:1;background:var(--bg-elevated);border-radius:4px;height:28px;overflow:hidden">
            <div style="height:100%;width:${(count/maxCount)*100}%;background:${colors[i%colors.length]};border-radius:4px;
              display:flex;align-items:center;padding:0 10px;font-size:12px;font-weight:700;color:#000;
              transition:width 0.6s ease;min-width:32px">
              ${count}
            </div>
          </div>
          <div style="width:48px;text-align:right;font-size:13px;font-weight:600;color:var(--text-muted)">${count} mem.</div>
        </div>
      `).join('');
      document.getElementById('plan-bars').innerHTML = barsHtml ||
        '<p class="text-muted" style="text-align:center">No members enrolled in plans yet.</p>';
    }

    loadDashboard();
  </script>
</body>
</html>
